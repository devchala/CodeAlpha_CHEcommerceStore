<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cart | ChalaStore</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="navbar">
    <a class="brand" href="/">Chala<span>Store</span></a>
    <nav><a href="/">Continue shopping</a></nav>
  </header>
  <main class="section">
    <p class="eyebrow">YOUR BAG</p>
    <h1>Shopping cart</h1>
    <div id="cartItems" class="cart-list"></div>
    <div class="cart-summary">
      <h2>Total: $<span id="cartTotal">0.00</span></h2>
      <button id="checkoutBtn" class="btn">Place order</button>
    </div>
    <p id="cartMessage"></p>
  </main>
  <script src="js/cart.js"></script>
</body>
</html>
