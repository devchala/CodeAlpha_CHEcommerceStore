<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard | ChalaStore</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/theme.js"></script>
</head>
<body class="admin-body">
  <div class="scrim" id="scrim"></div>
  <div class="admin-shell">
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="admin.html">Chala<span>Store</span><em class="tag">Admin</em></a>
      <nav id="adminNav" aria-label="Admin sections"></nav>
      <div class="side-foot">
        <a href="/" class="side-link">↗ View storefront</a>
        <button class="side-link" id="logoutBtn" type="button">⎋ Logout</button>
      </div>
    </aside>

    <div class="admin-main">
      <header class="admin-top">
        <button class="menu-toggle" id="sideToggle" aria-label="Open menu">☰</button>
        <h1 id="viewTitle">Overview</h1>
        <div class="top-actions"><span id="adminName" class="hello"></span><span id="themeSlot"></span></div>
      </header>

      <main class="admin-content">
        <p id="adminGate" class="msg error"></p>
        <div id="adminArea" hidden>

          <section id="view-overview" class="view">
            <div id="statCards" class="stat-grid"></div>
            <div class="panel-grid">
              <div class="panel"><h3>Sales · last 7 days</h3><div id="salesChart" class="bars"></div></div>
              <div class="panel"><h3>Orders by status</h3><div id="statusList" class="status-list"></div></div>
            </div>
            <div class="panel-grid">
              <div class="panel"><div class="panel-head"><h3>Recent orders</h3><a class="link" href="#orders">View all</a></div><div id="recentOrders"></div></div>
              <div class="panel"><div class="panel-head"><h3>Low stock</h3><a class="link" href="#products">Manage</a></div><div id="lowStock"></div></div>
            </div>
          </section>

          <section id="view-products" class="view" hidden>
            <form id="productForm" class="admin-form">
              <h2 id="formTitle">Add product</h2>
              <input type="hidden" id="pId">
              <input id="pName" placeholder="Product name" required>
              <input id="pCategory" placeholder="Category (e.g. Electronics)" required>
              <input id="pPrice" type="number" step="0.01" min="0" placeholder="Price" required>
              <input id="pStock" type="number" min="0" step="1" placeholder="Stock" required>
              <input id="pImage" class="wide" placeholder="Image path or URL (e.g. images/lamp.svg)" required>
              <textarea id="pDesc" class="wide" placeholder="Description" required></textarea>
              <div class="preview wide"><img id="pPreview" src="images/placeholder.svg" alt="Preview"><span>Image preview</span></div>
              <div class="form-actions wide">
                <button class="btn" type="submit" id="saveBtn">Save product</button>
                <button class="btn ghost" type="button" id="cancelBtn" hidden>Cancel edit</button>
              </div>
              <p id="adminMsg" class="msg wide"></p>
            </form>
            <div class="table-wrap"><table class="data-table"><thead><tr><th></th><th>Name</th><th>Category</th><th>Price</th><th>Stock</th><th></th></tr></thead><tbody id="productRows"></tbody></table></div>
          </section>

          <section id="view-orders" class="view" hidden>
            <div class="table-wrap"><table class="data-table"><thead><tr><th>Order</th><th>Customer</th><th>Items</th><th>Date</th><th>Total</th><th>Status</th></tr></thead><tbody id="orderRows"></tbody></table></div>
          </section>

          <section id="view-customers" class="view" hidden>
            <div class="table-wrap"><table class="data-table"><thead><tr><th>Name</th><th>Email</th><th>Joined</th><th>Orders</th><th>Spent</th></tr></thead><tbody id="customerRows"></tbody></table></div>
          </section>

        </div>
      </main>
    </div>
  </div>
  <script src="js/common.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
